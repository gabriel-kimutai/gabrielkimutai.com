## Base URL for the site
baseURL = 'https://gabrielkimutai.com'
## Site title
title = 'Gabriel Kimutai'
## Use hugo-brewm theme
theme = 'hugo-brewm'
## Enable Git information for pages, (e.g. lastMod date information)
enableGitInfo = true
## Convert all URLs to absolute URLs
canonifyURLs = true
## Default language for content
defaultContentLanguage = 'en'
## Put default language in subdirectory
defaultContentLanguageInSubdir = true
## Generate a robots.txt
enableRobotsTXT = true
## Files to ignore when building site
ignoreFiles = ['\.redacted', '\.old', '\.bak', '\.tmp', '\.swp', '\.DS_Store']

## markup configuration
[markup]

    [markup.highlight]
        codeFences = true
        noClasses = true

    [markup.goldmark.renderer]
        unsafe = true

    [markup.goldmark.extensions]
        [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
                block = [['\[', '\]'], ['$$', '$$'], ['\begin{equation}', '\end{equation}'], ['\begin{align}', '\end{align}']]
                inline = [['\(', '\)'], ['$', '$']]

[outputs]
    home = ['html', 'rss', 'json']

## Sitemap configuration
[sitemap]
    changeFreq = 'monthly'

## Taxonomy register
[taxonomies]
    category = 'categories'
    tag = 'tags'
    author = 'author'

## Site parameters
[params]
    title = "Gabriel Kimutai"
    description = "Software Developer / Engineer. I build backend systems, developer infrastructure, and applications that solve real problems."
    copyright = "© 2026 Gabriel Kimutai"
    ## Sections featured on the home feed (used by layouts/partials/paginator.html)
    mainSections = ['work', 'writing']
    HideHugoCredit = true
    extMeta = true
    coffeeStat = false
    AllowAIRobots = false
    ZenMode = true
    DisableFootBar = false
    unifiedFooter = true

    [params.analytics]
        append = 'body'

    [params.author]
        name = 'Gabriel Kimutai'
        email = 'contact@gabrielkimutai.com'

    [params.social]
        github = 'https://github.com/gabriel-kimutai'
        linkedin = 'https://www.linkedin.com/in/gabriel-kimutai-72b958235'
        email = 'mailto:contact@gabrielkimutai.com'

    [params.comments]
        disabled = true

    [params.favicon]

    [params.fediverse]
        instance = ''
        username = ''

    [params.feed]
        flowlines = false
        flowlinesLimit = 0

    [params.home]
        disableSlide = true
        disableListing = true
        includeSectionInJson = false

    [params.logo]
        ## Render site title as logotype in the header
        logoType = true

    [params.posts]
        justifying = false
        noIndent = true
        sfdefault = true
        colophon = false
        disableHistory = true
        related = false
        share = false
        secnum = false

    [params.RSS]
        limit = 15
        content = 15

    [params.style]
        [params.style.light]
            ac = '#0f766e'
            bg = '#f4f4f5'
            fg = '#18181b'
            mid = '#71717a'
            [params.style.light.less]
            [params.style.light.more]
        [params.style.dark]
            ac = '#2dd4bf'
            bg = '#0a0a0a'
            fg = '#fafafa'
            mid = '#a1a1aa'
            [params.style.dark.less]
            [params.style.dark.more]

    [params.search]
        enable = true
        pagefind = true

    [params.typeface]
        webSafe = false
        roman = 'crimson'
        sans = 'inter'
        localHost = false
        minimalUI = true

